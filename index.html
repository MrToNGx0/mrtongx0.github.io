<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jukkrit S. | Portfolio</title>
    <meta name="description" content="Jukkrit Sukkha (Tong) is a Full Stack Software Developer based in Bangkok, Thailand, specializing in building high-quality web applications. Explore his projects and experience." />
    <meta name="keywords" content="Jukkrit Sukkha, Tong, Software Developer, Full Stack, React, Portfolio, Bangkok, Web Development, Thailand" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mrtongx0.github.io/" />
    <meta property="og:title" content="Jukkrit S. | Portfolio" />
    <meta property="og:description" content="Full Stack Software Developer based in Bangkok, Thailand. View my portfolio and projects." />
    <meta property="og:image" content="/assets/image/profile.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mrtongx0.github.io/" />
    <meta property="twitter:title" content="Jukkrit S. | Portfolio" />
    <meta property="twitter:description" content="Full Stack Software Developer based in Bangkok, Thailand. View my portfolio and projects." />
    <meta property="twitter:image" content="/assets/image/profile.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Anuphan:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- start hero downloads before the JS bundle arrives -->
    <link rel="preload" as="image" href="/assets/image/profile.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/video/background-poster.jpg">
    <style>
      /* boot loader: plain HTML/CSS so it shows on first paint, before React loads */
      #boot { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity .6s ease, visibility .6s; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot img { width: 48px; height: 48px; border-radius: 9999px; }
      #boot .bar { width: 120px; height: 2px; background: #f1f5f9; overflow: hidden; border-radius: 2px; }
      #boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: oklch(75% 0.183 55.934); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <img src="/assets/image/logo.png" alt="">
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
